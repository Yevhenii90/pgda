<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGDA</title>
    <link
      id="favicon"
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%231d1d1f"/%3E%3Ctext x="32" y="42" text-anchor="middle" font-size="30"%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E'
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-labelledby="city-name">
      <header class="scene-meta scene-meta-left">
        <p id="weekday-label">---</p>
        <p id="date-label">-- ---</p>
      </header>

      <div class="scene-meta scene-meta-right" id="year-label">----</div>

      <section class="clock-block" aria-label="Поточний час">
        <span id="live-hours">--:--</span>
        <span class="clock-meridiem" id="live-meridiem">--</span>
      </section>

      <div class="floating-controls" aria-hidden="true">
        <button class="glass-arrow is-left" type="button">&#8592;</button>
        <button class="glass-arrow is-right" type="button">&#8594;</button>
      </div>

      <section class="weather-stack">
        <article class="weather-card" aria-label="Актуальна погода">
          <button class="ghost-close" type="button" aria-hidden="true">&#10005;</button>
          <div class="weather-card__content">
            <div class="weather-card__top">
              <div>
                <h1 id="city-name">Софіївська Борщагівка</h1>
                <p id="region-label">Київська область</p>
              </div>
            </div>

            <div class="cloud-stage" id="weather-visual" aria-hidden="true">
              <div class="cloud cloud-small" id="cloud-small"></div>
              <div class="cloud cloud-large" id="cloud-large"></div>
              <div class="sun-disk" id="sun-disk"></div>
              <div class="rain-layer" id="rain-layer">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>

            <div class="weather-card__bottom">
              <strong id="temperature">--°</strong>
              <div class="weather-card__meta">
                <p id="card-date">-- ---</p>
                <p id="condition">Очікуємо дані</p>
              </div>
            </div>
          </div>
        </article>

        <article class="week-card" aria-label="Прогноз на 5 днів">
          <button class="ghost-close week-close" type="button" aria-hidden="true">&#10005;</button>
          <div class="week-strip" id="daily-list"></div>
        </article>
      </section>

      <button class="menu-dot" type="button" aria-label="Меню">
        <span></span>
        <span></span>
      </button>

      <p class="status" id="status" role="status" aria-live="polite">
        Завантажую погоду для Софіївської Борщагівки...
      </p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
