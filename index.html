<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#e7e4df" />
    <title>PGDA</title>
    <script>
      try {
        const savedTheme = JSON.parse(localStorage.getItem("pgda-theme-override"));
        const currentHour = new Date().getHours();
        const initialTheme = ["day", "night"].includes(savedTheme?.theme) && savedTheme.expiresAt > Date.now()
          ? savedTheme.theme
          : (currentHour < 5 || currentHour >= 21 ? "night" : "day");
        document.documentElement.dataset.theme = initialTheme;
      } catch {}
    </script>
    <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23232325'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23ededeb'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260623-28" />
  </head>
  <body class="condition-cloudy">
    <main class="studio" aria-labelledby="city-name">
      <div class="ambient-glow" aria-hidden="true"></div>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Увімкнути нічну тему"
        aria-pressed="false"
      >
        <span class="theme-toggle__track" aria-hidden="true">
          <span class="theme-toggle__sun"></span>
          <span class="theme-toggle__moon"></span>
          <span class="theme-toggle__thumb"></span>
        </span>
      </button>

      <header class="date-lockup">
        <p><span id="weekday-label">---</span><i></i></p>
        <p id="date-label">-- ---</p>
      </header>
      <section class="clock" aria-label="Поточний місцевий час">
        <span id="live-hours">--:--</span>
      </section>

      <section class="installation" id="installation">
        <article class="weather-card" aria-label="Актуальна погода">
          <div class="card-surface"></div>
          <div class="artwork-motion" id="artwork-motion" aria-hidden="true">
            <span class="artwork-layer artwork-layer--primary"></span>
            <span class="artwork-layer artwork-layer--secondary"></span>
          </div>
          <div class="weather-card__heading">
            <h1 id="city-name">Дім</h1>
          </div>

          <div class="weather-object" id="weather-visual" aria-hidden="true">
            <div class="sun-sculpture"></div>
            <div class="cloud cloud-back"><span></span><i></i><b></b></div>
            <div class="cloud cloud-front"><span></span><i></i><b></b></div>
            <div class="precipitation rain-particles"></div>
            <div class="precipitation snow-particles"></div>
            <div class="fog-volume fog-one"></div>
            <div class="fog-volume fog-two"></div>
            <div class="wind-ribbon wind-one"></div>
            <div class="wind-ribbon wind-two"></div>
            <div class="lightning"></div>
          </div>

          <div class="weather-card__footer">
            <strong id="temperature">--°</strong>
            <div>
              <p id="condition">Очікуємо дані</p>
              <p id="card-date">-- ---</p>
            </div>
          </div>
        </article>

        <article class="forecast-card" id="daily-forecast" aria-label="Прогноз на п’ять днів">
          <button
            class="forecast-close"
            id="forecast-close"
            type="button"
            aria-label="Закрити прогноз і показати погоду на сьогодні"
          >
            <span aria-hidden="true"></span><span aria-hidden="true"></span>
          </button>
          <div class="week-strip" id="daily-list"></div>
        </article>

        <button
          class="menu-object"
          id="forecast-toggle"
          type="button"
          aria-label="Сховати прогноз на наступні дні"
          aria-controls="daily-forecast"
          aria-expanded="true"
        >
          <span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite">
        Завантажую актуальну погоду...
      </p>
    </main>
    <script src="app.js?v=20260623-13"></script>
  </body>
</html>
